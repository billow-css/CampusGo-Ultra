[package]
name = "campusgo-desktop"
version = "1.0.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
